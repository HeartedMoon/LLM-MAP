name: llm-map
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # Streamlit 核心依赖
    - streamlit>=1.48.1
    - streamlit-extras>=0.7.7
    
    # AI/ML 核心依赖
    - openai>=1.101.0
    - langchain==0.3.27
    - langchain-community>=0.3.27
    - langchain-core>=0.3.74
    - langchain-openai>=0.3.31
    - tiktoken>=0.11.0
    
    # 数据处理
    - pandas>=2.3.2
    - numpy>=2.2.6
    - scipy>=1.16.1
    - scikit-learn>=1.7.1
    
    # 文档处理（移除有问题的包）
    - pypdf>=6.0.0
    - python-docx>=1.2.0
    - beautifulsoup4>=4.13.5
    
    # 工具包
    - python-dotenv>=1.1.1
    - requests>=2.32.5
    - tenacity>=9.1.2
